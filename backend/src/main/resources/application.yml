spring:
  application:
    name: sinopcepte-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sinopcepte}
    username: ${DB_USERNAME:sinopcepte}
    password: ${DB_PASSWORD:sinopcepte}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # şema yalnız Flyway ile değişir
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: Europe/Istanbul

server:
  port: ${PORT:8080}
  # nginx / Next.js arkasında X-Forwarded-* başlıklarına güven
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 8h
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}   # HTTPS arkasında true yapın

app:
  time-zone: Europe/Istanbul
  cookies:
    # XSRF-TOKEN çerezinin Secure bayrağı; oturum çereziyle aynı değeri kullanır
    secure: ${SESSION_COOKIE_SECURE:false}
  admin:
    # Hiç ADMIN yoksa açılışta bu bilgilerle oluşturulur. Varsayılan YOK.
    username: ${ADMIN_USERNAME:}
    password: ${ADMIN_PASSWORD:}
  pharmacy:
    fetch-enabled: ${PHARMACY_FETCH_ENABLED:true}
    url: ${PHARMACY_URL:https://www.eczaneler.gen.tr/iframe.php?lokasyon=1627}
    user-agent: SinopCepte/1.0
    timeout: 15s

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
