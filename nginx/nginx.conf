# SinopCepte kenar vekili. Dışarıya yalnız bu açılır; frontend ve backend iç ağda kalır.
# Kritik: X-Forwarded-For istemcinin gönderdiğine EKLENMEZ, gerçek bağlantı IP'siyle EZİLİR.
# Backend hız sınırı bu değere güvenir (backend/src/main/resources/application.yml → forward-headers-strategy).
# HTTPS bu sunucuda sonlandırılacaksa X-Forwarded-Proto $scheme doğru değeri taşır; ayrıca .env'de
# SESSION_COOKIE_SECURE=true yapılmalı.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    server_tokens off;
    client_max_body_size 1m;

    upstream frontend {
        server frontend:3000;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Forwarded-For   $remote_addr;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Forwarded         "";
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        $http_connection;
        }
    }
}
